name: Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        id: set-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f install.xml ]]; then
            printf '%s\n' "install.xml not found" >&2
            exit 1
          fi

          version="$(grep -oP '(?<=<version>)[^<]+' install.xml || true)"

          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){2,}$ ]]; then
            printf '%s\n' "install.xml must contain a numeric, dot-separated version" >&2
            exit 1
          fi

          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Check if tag already exists
        id: tag-check
        shell: bash
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          set -euo pipefail

          tag_refs="$(git ls-remote --tags origin "refs/tags/${VERSION}")"
          if [[ -n "${tag_refs}" ]]; then
            printf '%s\n' "Tag ${VERSION} already exists"
            printf 'exists=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'exists=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Zip Repository
        if: steps.tag-check.outputs.exists == 'false'
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          rm -f TWITCH.zip
          git archive \
            --worktree-attributes \
            --format=zip \
            --output=TWITCH.zip \
            HEAD

          archive_entries="$(unzip -Z1 TWITCH.zip)"

          for required in install.xml Plugin.pm Config.pm PlayerSettings.pm strings.txt \
            HTML/EN/plugins/twitch/settings/player.html; do
            if ! grep -Fxq "${required}" <<< "${archive_entries}"; then
              printf '%s\n' "${required} missing from TWITCH.zip" >&2
              exit 1
            fi
          done
          unzip -p TWITCH.zip install.xml | cmp - install.xml

          if grep -Eq '^(\.github|repo)/' <<< "${archive_entries}"; then
            printf '%s\n' "Release-only files found in TWITCH.zip" >&2
            exit 1
          fi

          printf '%s\n' "${archive_entries}"

      - name: Setup Perl
        if: steps.tag-check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt update
          sudo apt install -y \
            libxml-simple-perl \
            libdigest-sha-perl

      - name: Update SHA and Version in repo.xml
        if: steps.tag-check.outputs.exists == 'false'
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          url="https://github.com/${REPOSITORY}/releases/download/${VERSION}"

          perl repo/release.pl repo/repo.xml "${VERSION}" TWITCH.zip "${url}"

      - name: Create Release
        if: steps.tag-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Version ${{ steps.set-version.outputs.version }}
          body: TWITCH plugin release
          draft: false
          prerelease: false
          files: TWITCH.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Repository
        if: steps.tag-check.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add repo/repo.xml

          if git diff --cached --quiet; then
            printf '%s\n' "No changes to commit"
          else
            git commit -m "Update repo.xml for release ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Skip message (already released)
        if: steps.tag-check.outputs.exists == 'true'
        shell: bash
        run: |
          printf '%s\n' "Release already exists - skipping all steps"

<script type="text/javascript">
(function () {
    var account = document.getElementById('pref_oauth_account');
    var controls = document.querySelectorAll('[data-account-required]');
    var notes = document.querySelectorAll('[data-account-needed]');
    var source = document.getElementById('pref_metadata_source');
    var inheritedHelix = [% IF twitch_server_helix %]true[% ELSE %]false[% END %];
    var sourceStatus = document.querySelector('[data-effective-source]');
    function updateSource() {
        if (sourceStatus && source) {
            sourceStatus.textContent = !source.disabled && (source.value === 'helix'
                || (source.value === 'inherit' && inheritedHelix)) ? 'Helix' : 'GraphQL';
        }
    }
    function updateAvailability() {
        var selected = account.options[account.selectedIndex];
        var connected = selected && selected.getAttribute('data-connected') === '1';
        for (var i = 0; i < controls.length; i++) {
            var control = controls[i];
            if (!control.disabled) {
                control.setAttribute('data-configured', control.value);
            }
            control.value = control.getAttribute(connected ? 'data-configured' : 'data-unavailable');
            control.disabled = !connected;
            for (var o = 0; o < control.options.length; o++) {
                if (control.options[o].value === 'unavailable') {
                    control.options[o].hidden = !!connected;
                }
            }
            if (control.parentNode.classList.contains('twitch-row')) {
                control.parentNode.classList.toggle('twitch-unavailable', !connected);
            }
        }
        for (var n = 0; n < notes.length; n++) {
            notes[n].hidden = !!connected;
        }
        updateSource();
    }
    account.addEventListener('change', updateAvailability);
    if (source) { source.addEventListener('change', updateSource); }
    updateAvailability();
}());
</script>
